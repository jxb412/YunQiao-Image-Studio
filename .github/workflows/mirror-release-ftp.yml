name: Mirror Release FTP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror, for example v0.1.19"
        required: true
        default: "v0.1.19"

jobs:
  mirror-ftp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: yunqiao-release-mirror" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" > release.json

          python3 - <<'PY' > assets.tsv
          import json
          data = json.load(open("release.json", "r", encoding="utf-8"))
          for asset in data.get("assets", []):
              print(f"{asset['name']}\t{asset['browser_download_url']}")
          PY

          while IFS=$'\t' read -r name url; do
            [ -n "${name}" ] || continue
            echo "Downloading ${name}"
            curl -fL --retry 8 --retry-delay 3 --connect-timeout 30 \
              -H "User-Agent: yunqiao-release-mirror" \
              -o "release-assets/${name}" \
              "${url}"
          done < assets.tsv

      - name: Prepare FTP root update manifest
        env:
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          PUBLIC_BASE_URL="${UPDATE_PUBLIC_BASE_URL:-https://down.haowucm.cn}"
          export PUBLIC_BASE_URL
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote

          public_base_url = os.environ.get("PUBLIC_BASE_URL", "https://down.haowucm.cn").rstrip("/")
          with open("release-assets/latest.json", "r", encoding="utf-8") as file:
              manifest = json.load(file)

          for item in manifest.get("downloads", {}).values():
              filename = item.get("filename")
              if filename:
                  item["url"] = f"{public_base_url}/{quote(filename)}"

          with open("release-assets/latest-ftp-root.json", "w", encoding="utf-8") as file:
              json.dump(manifest, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

      - name: Upload release assets to FTP
        env:
          FTP_HOST: ${{ secrets.UPDATE_FTP_HOST }}
          FTP_PORT: ${{ secrets.UPDATE_FTP_PORT }}
          FTP_USER: ${{ secrets.UPDATE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.UPDATE_FTP_PASSWORD }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_HOST:-}" ] || [ -z "${FTP_USER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "FTP secrets are not configured."
            exit 1
          fi
          FTP_PORT="${FTP_PORT:-21}"
          sudo apt-get update
          sudo apt-get install -y lftp

          mkdir -p release-clients
          cp release-assets/*.exe release-assets/*.dmg release-clients/

          # The FTP account can upload new files at the site root, while some
          # existing files or managed subdirectories may be owned by the panel.
          # Upload the runnable clients first, then mirror latest.json and
          # nested release folders on a best-effort basis.
          lftp -u "${FTP_USER},${FTP_PASSWORD}" -p "${FTP_PORT}" "${FTP_HOST}" <<EOF
          set cmd:fail-exit yes
          set cmd:interactive false
          set xfer:clobber on
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 60
          cd /
          mirror --reverse --continue --parallel=3 --verbose release-clients .
          put release-assets/latest-ftp-root.json -o latest-${TAG}.json
          bye
          EOF

          lftp -u "${FTP_USER},${FTP_PASSWORD}" -p "${FTP_PORT}" "${FTP_HOST}" <<EOF || echo "Could not overwrite root latest.json; keep versioned manifest latest-${TAG}.json."
          set cmd:fail-exit yes
          set cmd:interactive false
          set xfer:clobber on
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 60
          cd /
          rm -f latest.json
          put release-assets/latest-ftp-root.json -o latest.json
          bye
          EOF

          lftp -u "${FTP_USER},${FTP_PASSWORD}" -p "${FTP_PORT}" "${FTP_HOST}" <<EOF || echo "Could not mirror releases/${TAG}; FTP directory may be managed by the server panel."
          set cmd:fail-exit yes
          set cmd:interactive false
          set xfer:clobber on
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 60
          mkdir -p releases/${TAG}
          cd releases/${TAG}
          mput release-assets/*
          bye
          EOF

          lftp -u "${FTP_USER},${FTP_PASSWORD}" -p "${FTP_PORT}" "${FTP_HOST}" <<EOF || echo "Could not mirror yunqiao/releases/${TAG}; FTP directory may be managed by the server panel."
          set cmd:fail-exit yes
          set cmd:interactive false
          set xfer:clobber on
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 60
          mkdir -p yunqiao/releases/${TAG}
          cd yunqiao/releases/${TAG}
          mput release-assets/*
          cd /yunqiao
          put release-assets/latest-ftp-root.json -o latest-${TAG}.json
          bye
          EOF

          lftp -u "${FTP_USER},${FTP_PASSWORD}" -p "${FTP_PORT}" "${FTP_HOST}" <<EOF || echo "Could not mirror public_html; FTP directory may not be the web root."
          set cmd:fail-exit yes
          set cmd:interactive false
          set xfer:clobber on
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 60
          mkdir -p public_html
          cd public_html
          mput release-assets/*.exe
          mput release-assets/*.dmg
          put release-assets/latest-ftp-root.json -o latest-${TAG}.json
          bye
          EOF
